<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Pixel Survival V1 Web</title><link rel="stylesheet" href="/style.css"></head><body><canvas id="game"></canvas><div id="menu"><h1>PIXEL SURVIVAL</h1><p>3D 联机生存 · 手机 / 平板 / 电脑</p><input id="name" maxlength="18" placeholder="玩家昵称" value="Player"><select id="mode"><option value="squad">40 人 · 四人小队</option><option value="duel">1v1 · 单挑</option></select><div class="row"><button id="create">创建房间</button><input id="code" inputmode="numeric" maxlength="6" placeholder="六位房间号"><button id="join">加入</button></div><p id="roomtext">等待创建或加入房间</p><button id="start" hidden>开始游戏（房主）</button><p id="error"></p></div><div id="hud" hidden><div id="top"><button id="mapBtn">地图</button><span id="stats">加载中…</span><button id="bagBtn">背包</button></div><div id="team"></div><div id="weapons"></div><div id="loot"></div><div id="actions"><button id="reload">换弹</button><button id="heal">药包</button><button id="revive" hidden>救援</button><button id="edit">调键位</button></div><div id="move" class="stick"><div class="nub"></div><span>移动</span></div><div id="aim" class="stick"><div class="nub"></div><span>瞄准/射击</span></div></div><div id="bag" class="panel" hidden><div class="panelHead"><h2>背包</h2><button class="panelX" id="bagX" aria-label="关闭背包">✕</button></div><div id="bagItems"></div><button id="closeBag">关闭</button></div><div id="mapPanel" class="panel" hidden><div class="panelHead"><h2>大地图 · 毒圈</h2><button class="panelX" id="mapX" aria-label="关闭地图">✕</button></div><canvas id="mapCanvas" width="500" height="500"></canvas><button id="closeMap">关闭</button></div><div id="eliminated" class="panel" hidden style="z-index:120;text-align:center"><h2>队伍已全部淘汰</h2><p>本局游戏结束，可以返回大厅创建新房间。</p><button id="returnLobby" style="font-size:20px;padding:14px 28px">退出到大厅</button></div><div id="banner" hidden></div><script type="module" src="/game.js"></script></body></html>
